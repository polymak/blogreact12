<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogReact - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .x-gradient {
            background: linear-gradient(135deg, #1a91da, #0077b6);
        }
        
        .x-text {
            color: #1a91da;
        }
        
        .x-border {
            border-color: #1a91da;
        }
        
        .sidebar {
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        
        .sidebar.open {
            transform: translateX(0);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 119, 182, 0.2);
        }
        
        .btn-hover {
            transition: all 0.3s ease;
        }
        
        .btn-hover:hover {
            transform: translateY(-1px);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold x-text">BlogReact</h1>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="index.html" class="px-3 py-2 text-sm font-medium x-text hover:x-text-hover transition-colors">
                            <i class="fas fa-home mr-2"></i>Accueil
                        </a>
                        <button onclick="showBlogList()" class="px-3 py-2 text-sm font-medium x-text hover:x-text-hover transition-colors btn-hover">
                            <i class="fas fa-blog mr-2"></i>Blogs
                        </button>
                        <button onclick="showAddForm()" class="px-3 py-2 text-sm font-medium x-text hover:x-text-hover transition-colors btn-hover">
                            <i class="fas fa-plus mr-2"></i>Ajouter
                        </button>
                        <button onclick="logout()" class="px-3 py-2 text-sm font-medium text-red-600 hover:text-red-700 transition-colors btn-hover">
                            <i class="fas fa-sign-out-alt mr-2"></i>Déconnexion
                        </button>
                    </div>
                </div>
                <div class="md:hidden">
                    <button id="mobile-menu-btn" class="p-2 text-gray-500 hover:x-text">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-200">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="index.html" class="block px-3 py-2 text-base font-medium x-text hover:x-text-hover rounded-md transition-colors">
                    <i class="fas fa-home mr-2"></i>Accueil
                </a>
                <button onclick="showBlogList()" class="block w-full text-left px-3 py-2 text-base font-medium x-text hover:x-text-hover rounded-md transition-colors">
                    <i class="fas fa-blog mr-2"></i>Blogs
                </button>
                <button onclick="showAddForm()" class="block w-full text-left px-3 py-2 text-base font-medium x-text hover:x-text-hover rounded-md transition-colors">
                    <i class="fas fa-plus mr-2"></i>Ajouter
                </button>
                <button onclick="logout()" class="block w-full text-left px-3 py-2 text-base font-medium text-red-600 hover:text-red-700 rounded-md transition-colors">
                    <i class="fas fa-sign-out-alt mr-2"></i>Déconnexion
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Welcome Section -->
        <div class="mb-8 animate-fade-in">
            <h1 class="text-3xl font-bold x-text mb-2">Tableau de Bord Admin</h1>
            <p class="text-gray-600">Gérez vos articles et contenu</p>
        </div>

        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-lg p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">Total Articles</p>
                        <p class="text-2xl font-bold x-text" id="total-articles">0</p>
                    </div>
                    <div class="text-4xl x-text">
                        <i class="fas fa-newspaper"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">Aujourd'hui</p>
                        <p class="text-2xl font-bold x-text" id="today-articles">0</p>
                    </div>
                    <div class="text-4xl x-text">
                        <i class="fas fa-calendar-day"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">En Ligne</p>
                        <p class="text-2xl font-bold x-text">Oui</p>
                    </div>
                    <div class="text-4xl x-text">
                        <i class="fas fa-globe"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions Bar -->
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <button onclick="showBlogList()" class="flex-1 x-gradient text-white py-3 px-6 rounded-lg font-semibold btn-hover transition-all duration-300 transform hover:scale-105">
                <i class="fas fa-list mr-2"></i>Voir les Articles
            </button>
            <button onclick="showAddForm()" class="flex-1 bg-white border x-border text-gray-700 py-3 px-6 rounded-lg font-semibold hover:bg-gray-50 transition-all duration-300">
                <i class="fas fa-plus mr-2"></i>Ajouter un Article
            </button>
        </div>

        <!-- Blog List Section -->
        <section id="blog-list" class="hidden">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold x-text">Liste des Articles</h2>
                    <div class="flex gap-2">
                        <input type="text" id="search-input" placeholder="Rechercher un article..." class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="searchArticles()" class="px-4 py-2 x-gradient text-white rounded-lg hover:bg-blue-700 transition-colors">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                <div id="articles-container" class="space-y-4">
                    <!-- Articles will be loaded here -->
                </div>
            </div>
        </section>

        <!-- Add/Edit Form Section -->
        <section id="add-form" class="hidden">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h2 class="text-2xl font-bold x-text mb-6" id="form-title">Ajouter un Article</h2>
                <form id="article-form" class="space-y-6">
                    <input type="hidden" id="article-id">
                    
                    <div>
                        <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Titre</label>
                        <input type="text" id="title" name="title" required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                               placeholder="Entrez le titre de l'article">
                    </div>

                    <div>
                        <label for="content" class="block text-sm font-medium text-gray-700 mb-2">Contenu</label>
                        <textarea id="content" name="content" rows="6" required
                                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                                  placeholder="Entrez le contenu de l'article"></textarea>
                    </div>

                    <div>
                        <label for="image" class="block text-sm font-medium text-gray-700 mb-2">Image</label>
                        <div class="flex items-center space-x-4">
                            <input type="file" id="image" name="image" accept="image/*"
                                   class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <div id="image-preview" class="hidden">
                                <img id="preview-img" class="h-20 w-20 object-cover rounded-lg">
                                <button type="button" onclick="removeImage()" class="ml-2 text-red-500 hover:text-red-700">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button type="submit" class="flex-1 x-gradient text-white py-3 px-6 rounded-lg font-semibold btn-hover transition-all duration-300 transform hover:scale-105">
                            <i class="fas fa-paper-plane mr-2"></i><span id="submit-btn-text">Publier</span>
                        </button>
                        <button type="button" onclick="cancelEdit()" class="flex-1 bg-gray-200 text-gray-700 py-3 px-6 rounded-lg font-semibold hover:bg-gray-300 transition-colors">
                            <i class="fas fa-times mr-2"></i>Annuler
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg hidden transition-all duration-300 transform translate-y-10 opacity-0">
        <span id="toast-message">Action réussie !</span>
    </div>

<script>

const API_URL = "https://blogreact12-api.reatest.workers.dev";

// State
let articles = [];
let editingArticle = null;

// INIT
document.addEventListener('DOMContentLoaded', () => {
    checkAuth();
    loadArticles();
});

// AUTH
function checkAuth() {
    const token = localStorage.getItem('auth_token');
    if (!token) window.location.href = 'login.html';
}

// ================= LOAD ARTICLES =================
async function loadArticles() {
    try {
        const res = await fetch(`${API_URL}/api/articles`);
        const data = await res.json();

        if (!data.success) throw new Error();

        articles = data.data;

        updateStats();
        renderArticles();

    } catch (err) {
        showToast("Erreur chargement articles", "error");
    }
}

// ================= DELETE =================
async function deleteArticle(id) {
    if (!confirm("Supprimer ?")) return;

    await fetch(`${API_URL}/api/articles/${id}`, {
        method: "DELETE",
        headers: {
            "Authorization": "Bearer " + localStorage.getItem("auth_token")
        }
    });

    loadArticles();
}

// ================= SAVE (FIX PRINCIPAL) =================
document.getElementById('article-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const titre = document.getElementById('title').value;
    const contenu = document.getElementById('content').value;

    // 👉 image simple (URL placeholder pour éviter bug)
    let image = "";

    if (document.getElementById('preview-img').src) {
        image = document.getElementById('preview-img').src;
    }

    const payload = {
        titre,
        contenu,
        image,
        auteur: "Admin",
        categorie: "General"
    };

    try {

        const url = editingArticle
            ? `${API_URL}/api/articles/${editingArticle.id}`
            : `${API_URL}/api/articles`;

        const method = editingArticle ? "PUT" : "POST";

        const res = await fetch(url, {
            method,
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + localStorage.getItem("auth_token")
            },
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!data.success) throw new Error();

        showToast(editingArticle ? "Article modifié" : "Article publié");

        editingArticle = null;

        loadArticles();
        showBlogList();

    } catch (err) {
        showToast("Erreur sauvegarde", "error");
    }
});

// ================= EDIT =================
function handleEdit(id) {
    const article = articles.find(a => a.id == id);
    if (!article) return;

    editingArticle = article;

    document.getElementById('title').value = article.titre;
    document.getElementById('content').value = article.contenu;

    if (article.image) {
        document.getElementById('preview-img').src = article.image;
        document.getElementById('image-preview').classList.remove('hidden');
    }

    showAddForm();
}

// ================= RENDER =================
function renderArticles() {

    const container = document.getElementById('articles-container');

    container.innerHTML = articles.map(a => `
        <div class="bg-gray-50 p-4 rounded-lg">
            <h3 class="font-bold">${a.titre}</h3>
            <p>${a.contenu}</p>

            <div class="flex gap-2 mt-2">
                <button onclick="handleEdit(${a.id})" class="bg-blue-500 text-white px-2 py-1 rounded">Edit</button>
                <button onclick="deleteArticle(${a.id})" class="bg-red-500 text-white px-2 py-1 rounded">Delete</button>
            </div>
        </div>
    `).join('');
}

// ================= STATS =================
function updateStats() {
    document.getElementById('total-articles').innerText = articles.length;
}

// ================= UI =================
function showBlogList() {
    document.getElementById('blog-list').classList.remove('hidden');
    document.getElementById('add-form').classList.add('hidden');
}

function showAddForm() {
    document.getElementById('blog-list').classList.add('hidden');
    document.getElementById('add-form').classList.remove('hidden');
}

function logout() {
    localStorage.removeItem("auth_token");
    window.location.href = "login.html";
}

// ================= TOAST =================
function showToast(msg, type = "success") {
    const toast = document.getElementById('toast');
    const text = document.getElementById('toast-message');

    text.innerText = msg;

    toast.classList.remove('hidden');
    toast.classList.remove('translate-y-10');

    toast.classList.add(type === "error" ? "bg-red-500" : "bg-green-500");

    setTimeout(() => {
        toast.classList.add('translate-y-10');
    }, 3000);
}

</script>
</body>
</html>
