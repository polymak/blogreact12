<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogReact - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .x-gradient {
            background: linear-gradient(135deg, #1a91da, #0077b6);
        }
        
        .x-text {
            color: #1a91da;
        }
        
        .x-border {
            border-color: #1a91da;
        }
        
        .sidebar {
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        
        .sidebar.open {
            transform: translateX(0);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 119, 182, 0.2);
        }
        
        .btn-hover {
            transition: all 0.3s ease;
        }
        
        .btn-hover:hover {
            transform: translateY(-1px);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold x-text">BlogReact</h1>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="index.html" class="px-3 py-2 text-sm font-medium x-text hover:x-text-hover transition-colors">
                            <i class="fas fa-home mr-2"></i>Accueil
                        </a>
                        <button onclick="showBlogList()" class="px-3 py-2 text-sm font-medium x-text hover:x-text-hover transition-colors btn-hover">
                            <i class="fas fa-blog mr-2"></i>Blogs
                        </button>
                        <button onclick="showAddForm()" class="px-3 py-2 text-sm font-medium x-text hover:x-text-hover transition-colors btn-hover">
                            <i class="fas fa-plus mr-2"></i>Ajouter
                        </button>
                        <button onclick="logout()" class="px-3 py-2 text-sm font-medium text-red-600 hover:text-red-700 transition-colors btn-hover">
                            <i class="fas fa-sign-out-alt mr-2"></i>Déconnexion
                        </button>
                    </div>
                </div>
                <div class="md:hidden">
                    <button id="mobile-menu-btn" class="p-2 text-gray-500 hover:x-text">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-200">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="index.html" class="block px-3 py-2 text-base font-medium x-text hover:x-text-hover rounded-md transition-colors">
                    <i class="fas fa-home mr-2"></i>Accueil
                </a>
                <button onclick="showBlogList()" class="block w-full text-left px-3 py-2 text-base font-medium x-text hover:x-text-hover rounded-md transition-colors">
                    <i class="fas fa-blog mr-2"></i>Blogs
                </button>
                <button onclick="showAddForm()" class="block w-full text-left px-3 py-2 text-base font-medium x-text hover:x-text-hover rounded-md transition-colors">
                    <i class="fas fa-plus mr-2"></i>Ajouter
                </button>
                <button onclick="logout()" class="block w-full text-left px-3 py-2 text-base font-medium text-red-600 hover:text-red-700 rounded-md transition-colors">
                    <i class="fas fa-sign-out-alt mr-2"></i>Déconnexion
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Welcome Section -->
        <div class="mb-8 animate-fade-in">
            <h1 class="text-3xl font-bold x-text mb-2">Tableau de Bord Admin</h1>
            <p class="text-gray-600">Gérez vos articles et contenu</p>
        </div>

        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-lg p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">Total Articles</p>
                        <p class="text-2xl font-bold x-text" id="total-articles">0</p>
                    </div>
                    <div class="text-4xl x-text">
                        <i class="fas fa-newspaper"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">Aujourd'hui</p>
                        <p class="text-2xl font-bold x-text" id="today-articles">0</p>
                    </div>
                    <div class="text-4xl x-text">
                        <i class="fas fa-calendar-day"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">En Ligne</p>
                        <p class="text-2xl font-bold x-text">Oui</p>
                    </div>
                    <div class="text-4xl x-text">
                        <i class="fas fa-globe"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions Bar -->
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <button onclick="showBlogList()" class="flex-1 x-gradient text-white py-3 px-6 rounded-lg font-semibold btn-hover transition-all duration-300 transform hover:scale-105">
                <i class="fas fa-list mr-2"></i>Voir les Articles
            </button>
            <button onclick="showAddForm()" class="flex-1 bg-white border x-border text-gray-700 py-3 px-6 rounded-lg font-semibold hover:bg-gray-50 transition-all duration-300">
                <i class="fas fa-plus mr-2"></i>Ajouter un Article
            </button>
        </div>

        <!-- Blog List Section -->
        <section id="blog-list" class="hidden">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold x-text">Liste des Articles</h2>
                    <div class="flex gap-2">
                        <input type="text" id="search-input" placeholder="Rechercher un article..." class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="searchArticles()" class="px-4 py-2 x-gradient text-white rounded-lg hover:bg-blue-700 transition-colors">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                <div id="articles-container" class="space-y-4">
                    <!-- Articles will be loaded here -->
                </div>
            </div>
        </section>

        <!-- Add/Edit Form Section -->
        <section id="add-form" class="hidden">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h2 class="text-2xl font-bold x-text mb-6" id="form-title">Ajouter un Article</h2>
                <form id="article-form" class="space-y-6">
                    <input type="hidden" id="article-id">
                    
                    <div>
                        <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Titre</label>
                        <input type="text" id="title" name="title" required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                               placeholder="Entrez le titre de l'article">
                    </div>

                    <div>
                        <label for="content" class="block text-sm font-medium text-gray-700 mb-2">Contenu</label>
                        <textarea id="content" name="content" rows="6" required
                                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"
                                  placeholder="Entrez le contenu de l'article"></textarea>
                    </div>

                    <div>
                        <label for="image" class="block text-sm font-medium text-gray-700 mb-2">Image</label>
                        <div class="flex items-center space-x-4">
                            <input type="file" id="image" name="image" accept="image/*"
                                   class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <div id="image-preview" class="hidden">
                                <img id="preview-img" class="h-20 w-20 object-cover rounded-lg">
                                <button type="button" onclick="removeImage()" class="ml-2 text-red-500 hover:text-red-700">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button type="submit" class="flex-1 x-gradient text-white py-3 px-6 rounded-lg font-semibold btn-hover transition-all duration-300 transform hover:scale-105">
                            <i class="fas fa-paper-plane mr-2"></i><span id="submit-btn-text">Publier</span>
                        </button>
                        <button type="button" onclick="cancelEdit()" class="flex-1 bg-gray-200 text-gray-700 py-3 px-6 rounded-lg font-semibold hover:bg-gray-300 transition-colors">
                            <i class="fas fa-times mr-2"></i>Annuler
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg hidden transition-all duration-300 transform translate-y-10 opacity-0">
        <span id="toast-message">Action réussie !</span>
    </div>

    <script>
        // State management
        let articles = [];
        let editingArticle = null;

        // Mobile Navigation Toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        mobileMenuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadArticles();
        });

        // Authentication check
        function checkAuth() {
            const token = localStorage.getItem('auth_token');
            if (!token) {
                window.location.href = 'login.html';
            }
        }

        // Logout function
        function logout() {
            if (confirm('Êtes-vous sûr de vouloir vous déconnecter ?')) {
                localStorage.removeItem('auth_token');
                window.location.href = 'login.html';
            }
        }

        // Load articles
        async function loadArticles() {
            try {
                const response = await
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('auth_token')}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Erreur lors du chargement des articles');
                }
                
                articles = await response.json();
                
                updateStats();
                renderArticles();
                
            } catch (error) {
                console.error('Error loading articles:', error);
                showToast('Erreur lors du chargement des articles', 'error');
            }
        }

        // Update statistics
        function updateStats() {
            document.getElementById('total-articles').textContent = articles.length;
            
            const today = new Date().toDateString();
            const todayArticles = articles.filter(article => 
                new Date(article.date).toDateString() === today
            );
            document.getElementById('today-articles').textContent = todayArticles.length;
        }

        // Render articles list
        function renderArticles(searchTerm = '') {
            const container = document.getElementById('articles-container');
            let filteredArticles = articles;

            if (searchTerm) {
                filteredArticles = articles.filter(article => 
                    article.titre.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    article.contenu.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            if (filteredArticles.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-newspaper text-6xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 text-lg">Aucun article trouvé</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredArticles.map(article => `
                <div class="article-card bg-gray-50 rounded-lg p-4 card-hover transition-all duration-300 animate-fade-in">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <div class="flex items-center gap-4 mb-2">
                                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800">
                                    <i class="fas fa-calendar-alt mr-2"></i>
                                    ${new Date(article.date).toLocaleDateString('fr-FR')}
                                </span>
                                <span class="text-sm text-gray-500">${article.author || 'Admin'}</span>
                            </div>
                            <h3 class="text-lg font-semibold text-gray-900 mb-2">${article.titre}</h3>
                            <p class="text-gray-600 mb-4 line-clamp-2">${article.contenu}</p>
                            ${article.image ? `<img src="${article.image.startsWith('http') ? article.image : 'https://blogreact12.pages.dev' + article.image}" alt="${article.titre}" class="w-20 h-20 object-cover rounded-lg mb-4">` : ''}
                        </div>
                        <div class="flex flex-col gap-2">
                            <button onclick="handleEdit('${article.id}')" class="edit-btn px-3 py-1 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition-colors cursor-pointer">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="handleDelete('${article.id}')" class="delete-btn px-3 py-1 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition-colors cursor-pointer">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            // Add event listeners for dynamically created buttons
            setTimeout(() => {
                const editButtons = container.querySelectorAll('.edit-btn');
                const deleteButtons = container.querySelectorAll('.delete-btn');
                
                editButtons.forEach((btn, index) => {
                    const article = filteredArticles[index];
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        handleEdit(article.id);
                    });
                });
                
                deleteButtons.forEach((btn, index) => {
                    const article = filteredArticles[index];
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        handleDelete(article.id);
                    });
                });
            }, 100);
        }

        // Handle edit with better error handling
        function handleEdit(id) {
            try {
                console.log('Editing article with ID:', id);
                console.log('Articles array:', articles);
                editArticle(id);
            } catch (error) {
                console.error('Error editing article:', error);
                showToast('Erreur lors de l\'édition de l\'article', 'error');
            }
        }

        // Handle delete with better error handling
        function handleDelete(id) {
            try {
                deleteArticle(id);
            } catch (error) {
                console.error('Error deleting article:', error);
                showToast('Erreur lors de la suppression de l\'article', 'error');
            }
        }

        // Search articles
        function searchArticles() {
            const searchTerm = document.getElementById('search-input').value;
            renderArticles(searchTerm);
        }

        // Show blog list
        function showBlogList() {
            document.getElementById('blog-list').classList.remove('hidden');
            document.getElementById('add-form').classList.add('hidden');
            renderArticles();
        }

        // Show add form
        function showAddForm() {
            document.getElementById('blog-list').classList.add('hidden');
            document.getElementById('add-form').classList.remove('hidden');
            // Ne pas réinitialiser le formulaire si on est en mode édition
            if (!editingArticle) {
                document.getElementById('form-title').textContent = 'Ajouter un Article';
                document.getElementById('submit-btn-text').textContent = 'Publier';
                document.getElementById('article-form').reset();
                document.getElementById('article-id').value = '';
                document.getElementById('image-preview').classList.add('hidden');
            } else {
                document.getElementById('form-title').textContent = 'Modifier l\'Article';
                document.getElementById('submit-btn-text').textContent = 'Mettre à jour';
            }
        }

        // Edit article
        function editArticle(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;

            editingArticle = article;
            document.getElementById('form-title').textContent = 'Modifier l\'Article';
            document.getElementById('article-id').value = article.id;
            document.getElementById('title').value = article.titre;
            document.getElementById('content').value = article.contenu;
            
            if (article.image) {
                // Gérer correctement l'URL de l'image
                const imageUrl = article.image.startsWith('http') ? article.image : 'https://blogreact12.pages.dev' + article.image;
                document.getElementById('preview-img').src = imageUrl;
                document.getElementById('image-preview').classList.remove('hidden');
                console.log('Image preview URL:', imageUrl);
            } else {
                document.getElementById('image-preview').classList.add('hidden');
            }

            showAddForm();
        }

        // Cancel edit
        function cancelEdit() {
            editingArticle = null;
            showBlogList();
        }

        // Delete article
        async function deleteArticle(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer cet article ?')) {
                return;
            }

            try {
                const response = await fetch(`https://blogreact12.pages.dev/articles/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('auth_token')}`
                    }
                });

                if (response.ok) {
                    articles = articles.filter(a => a.id !== id);
                    updateStats();
                    renderArticles();
                    showToast('Article supprimé avec succès');
                } else {
                    throw new Error('Failed to delete article');
                }
            } catch (error) {
                console.error('Error deleting article:', error);
                showToast('Erreur lors de la suppression', 'error');
            }
        }

        // Form submission
        document.getElementById('article-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData();
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            
            // Validation frontend
            if (!title) {
                showToast('Veuillez saisir un titre', 'error');
                return;
            }
            
            if (!content) {
                showToast('Veuillez saisir le contenu', 'error');
                return;
            }

            formData.append('titre', title);
            formData.append('contenu', content);
            formData.append('auteur', 'Admin');
            
            const imageInput = document.getElementById('image');
            if (imageInput.files[0]) {
                formData.append('image', imageInput.files[0]);
            }

            try {
                const url = editingArticle 
                    ? `https://blogreact12.pages.dev/articles/${editingArticle.id}`
                    : 'https://blogreact12.pages.dev/articles';
                
                const method = editingArticle ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('auth_token')}`
                    },
                    body: formData
                });

                const result = await response.json();

                if (response.ok && result.success !== false) {
                    if (editingArticle) {
                        // Update existing article
                        const index = articles.findIndex(a => a.id === editingArticle.id);
                        if (index !== -1) {
                            articles[index] = result.article || result;
                        }
                        showToast('Article modifié avec succès', 'success');
                    } else {
                        // Add new article
                        articles.unshift(result.article || result);
                        showToast('Article publié avec succès', 'success');
                    }

                    updateStats();
                    renderArticles(); // Refresh the articles list
                    showBlogList();
                    
                    // Refresh the page after a short delay to ensure changes are visible
                    setTimeout(() => {
                        if (!editingArticle) {
                            // For new articles, refresh the page to show the latest content
                            location.reload();
                        }
                    }, 1500);
                } else {
                    const errorMessage = result.error || result.message || 'Échec de l\'enregistrement de l\'article';
                    showToast('Erreur: ' + errorMessage, 'error');
                }
            } catch (error) {
                console.error('Error saving article:', error);
                showToast('Erreur réseau: Vérifiez que le serveur est démarré', 'error');
            }
        });

        // Image preview
        document.getElementById('image').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('preview-img').src = e.target.result;
                    document.getElementById('image-preview').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Remove image
        function removeImage() {
            document.getElementById('image').value = '';
            document.getElementById('image-preview').classList.add('hidden');
        }

        // Toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            
            toastMessage.textContent = message;
            toast.classList.remove('hidden', 'translate-y-10', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
