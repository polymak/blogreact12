<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlogReact - Accueil</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body { font-family: 'Inter', sans-serif; }

.x-gradient {
    background: linear-gradient(135deg, #1a91da, #0077b6);
}
.x-text { color: #1a91da; }

.card:hover {
    transform: translateY(-5px);
    transition: 0.3s;
}
</style>
</head>

<body class="bg-gray-50">

<!-- NAV -->
<nav class="bg-white shadow p-4 flex justify-between">
    <h1 class="text-xl font-bold x-text">BlogReact</h1>

    <div>
        <a href="index.html" class="mr-4">Accueil</a>
        <a href="login.html" id="loginBtn">Connexion</a>
        <a href="dashboard.html" id="adminBtn" style="display:none;">Admin</a>
    </div>
</nav>

<!-- CONTENT -->
<main class="max-w-7xl mx-auto p-6">

<h2 class="text-3xl font-bold mb-6 x-text">Articles</h2>

<div id="articles-grid" class="grid md:grid-cols-3 gap-6"></div>

<div id="loading" class="text-center mt-10">
    <i class="fas fa-spinner fa-spin text-3xl text-blue-500"></i>
</div>

<div id="error" class="hidden text-center text-red-500 mt-10">
    Erreur de chargement
</div>

<div id="empty" class="hidden text-center mt-10">
    Aucun article disponible
</div>

</main>

<footer class="text-center p-4 bg-gray-900 text-white">
© 2026 BlogReact
</footer>

<script>

const API = "https://blogreact12-api.reatest.workers.dev";

/* ================= LOAD ARTICLES ================= */

async function loadArticles() {

    const container = document.getElementById("articles-grid");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");
    const empty = document.getElementById("empty");

    try {

        const res = await fetch(`${API}/api/articles`);
        const result = await res.json();

        loading.style.display = "none";

        if (!result.success || !result.data.length) {
            empty.classList.remove("hidden");
            return;
        }

        container.innerHTML = result.data.map(article => {

            const image = article.image || "https://picsum.photos/400/250";

            return `
            <div class="bg-white rounded-xl shadow p-4 card cursor-pointer"
                 onclick="goArticle(${article.id})">

                <img src="${image}" class="w-full h-40 object-cover rounded mb-3">

                <h3 class="font-bold text-lg mb-2">${article.titre}</h3>

                <p class="text-gray-600 text-sm mb-3">
                    ${article.contenu.substring(0, 100)}...
                </p>

                <div class="text-xs text-gray-400 flex justify-between">
                    <span>${article.auteur || "Admin"}</span>
                    <span>${new Date(article.date).toLocaleDateString()}</span>
                </div>

            </div>
            `;
        }).join("");

    } catch (e) {

        console.error(e);
        loading.style.display = "none";
        error.classList.remove("hidden");

    }
}

/* ================= NAVIGATION ================= */

function goArticle(id) {
    window.location.href = `article.html?id=${id}`;
}

/* ================= AUTH MENU ================= */

document.addEventListener("DOMContentLoaded", () => {

    const token = localStorage.getItem("token");

    if (token) {
        document.getElementById("loginBtn").style.display = "none";
        document.getElementById("adminBtn").style.display = "inline";
    }

    loadArticles();
});

</script>

</body>
</html>
