<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogReact - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

    <h2 class="text-2xl font-bold text-center mb-6 text-blue-600">
        Connexion BlogReact
    </h2>

    <form id="login-form" class="space-y-4">

        <input type="text" id="username" placeholder="Username (admin)"
            class="w-full p-3 border rounded-lg" required>

        <input type="password" id="password" placeholder="Mot de passe"
            class="w-full p-3 border rounded-lg" required>

        <button type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg">
            Se connecter
        </button>

    </form>

    <div id="error" class="hidden mt-4 text-red-500 text-center"></div>
    <div id="success" class="hidden mt-4 text-green-500 text-center"></div>

</div>

<script>

const API_URL = "https://blogreact12-api.reatest.workers.dev";

const form = document.getElementById("login-form");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    hideMessages();

    try {

        console.log("➡️ Envoi login vers:", API_URL + "/api/login");

        const res = await fetch(`${API_URL}/api/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, password })
        });

        console.log("📡 Status:", res.status);

        // 🔥 lire d'abord en texte (évite crash JSON)
        const text = await res.text();
        console.log("📥 Raw response:", text);

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            throw new Error("Réponse API invalide (pas du JSON)");
        }

        console.log("✅ Parsed JSON:", data);

        if (!res.ok) {
            throw new Error(data.message || data.error || "Erreur serveur");
        }

        if (data.success) {

            localStorage.setItem("auth_token", data.token);

            showSuccess("Connexion réussie ✅");

            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1000);

        } else {
            showError(data.message || "Identifiants incorrects");
        }

    } catch (err) {
        console.error("❌ Erreur login:", err);
        showError(err.message || "Erreur serveur");
    }

});

function showError(msg) {
    const el = document.getElementById("error");
    el.innerText = msg;
    el.classList.remove("hidden");
}

function showSuccess(msg) {
    const el = document.getElementById("success");
    el.innerText = msg;
    el.classList.remove("hidden");
}

function hideMessages() {
    document.getElementById("error").classList.add("hidden");
    document.getElementById("success").classList.add("hidden");
}

</script>

</body>
</html>
