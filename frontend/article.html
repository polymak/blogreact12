<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogReact - Article</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .x-gradient {
            background: linear-gradient(135deg, #1a91da, #0077b6);
        }
        
        .x-text {
            color: #1a91da;
        }
        
        .x-border {
            border-color: #1a91da;
        }
        
        .article-image {
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .article-content {
            animation: fadeIn 0.8s ease-out;
        }
        
        .btn-hover {
            transition: all 0.3s ease;
        }
        
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 119, 182, 0.2);
        }
        
        .like-btn {
            transition: all 0.3s ease;
        }
        
        .like-btn.liked {
            transform: scale(1.2);
            color: #ef4444;
        }
        
        .share-btn {
            transition: all 0.3s ease;
        }
        
        .share-btn:hover {
            transform: scale(1.1);
        }
        
        .author-card {
            transition: all 0.3s ease;
        }
        
        .author-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 119, 182, 0.1);
        }
        
        /* Article content paragraph styling */
        .article-content p {
            margin-bottom: 18px;
            line-height: 1.7;
            text-align: justify;
        }
        
        .article-content p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold x-text">BlogReact</a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                <a href="index.html" id="menu-home" class="px-3 py-2 text-sm font-medium x-text hover:x-text-hover transition-colors">Accueil</a>
                        <a href="login.html" id="menu-login" class="px-3 py-2 text-sm font-medium x-text hover:x-text-hover transition-colors">Connexion</a>
                        <a href="dashboard.html" id="menu-admin" class="px-3 py-2 text-sm font-medium x-text hover:x-text-hover transition-colors" style="display:none;">Administration du site</a>
                    </div>
                </div>
                <div class="md:hidden">
                    <button id="mobile-menu-btn" class="p-2 text-gray-500 hover:x-text">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-200">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="index.html" class="block px-3 py-2 text-base font-medium x-text hover:x-text-hover rounded-md transition-colors">Accueil</a>
                <a href="login.html" class="block px-3 py-2 text-base font-medium x-text hover:x-text-hover rounded-md transition-colors">Connexion</a>
                <a href="dashboard.html" class="block px-3 py-2 text-base font-medium x-text hover:x-text-hover rounded-md transition-colors">Admin</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Article Header -->
        <article class="bg-white rounded-2xl shadow-lg overflow-hidden mb-8">
            <div class="article-image">
                <img id="article-image" src="" alt="" class="w-full h-64 sm:h-96 object-cover">
            </div>
            <div class="p-8">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-4">
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800">
                            <i class="fas fa-calendar-alt mr-2"></i>
                            <span id="article-date"></span>
                        </span>
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800">
                            <i class="fas fa-tag mr-2"></i>
                            <span id="article-category"></span>
                        </span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button id="like-btn" class="like-btn flex items-center px-3 py-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-colors">
                            <i class="far fa-heart mr-2"></i>
                            <span id="like-count">0</span>
                        </button>
                        <button id="share-btn" class="share-btn flex items-center px-3 py-2 bg-gray-50 text-gray-600 rounded-lg hover:bg-gray-100 transition-colors">
                            <i class="fas fa-share mr-2"></i>
                            Partager
                        </button>
                    </div>
                </div>
                
                <h1 id="article-title" class="text-3xl sm:text-4xl font-bold text-gray-900 mb-4"></h1>
                
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold mr-3">
                            <i class="fas fa-user"></i>
                        </div>
                        <div>
                            <p class="font-semibold text-gray-900" id="article-author">Admin</p>
                            <p class="text-sm text-gray-500" id="article-read-time">5 min de lecture</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-gray-500">Vues: <span id="article-views">0</span></p>
                    </div>
                </div>
            </div>
        </article>

        <!-- Article Content -->
        <div class="bg-white rounded-2xl shadow-lg p-8 mb-8">
            <div id="article-content" class="prose prose-lg max-w-none text-gray-700 leading-relaxed">
                <!-- Article content will be loaded here -->
            </div>
        </div>

        <!-- Author Section -->
        <div class="author-card bg-white rounded-2xl shadow-lg p-6 mb-8">
            <div class="flex items-center">
                <div class="w-16 h-16 bg-blue-500 rounded-full flex items-center justify-center text-white text-2xl font-bold mr-4">
                    <i class="fas fa-user"></i>
                </div>
                <div>
                    <h3 class="text-xl font-semibold text-gray-900" id="author-name">Admin</h3>
                    <p class="text-gray-600" id="author-bio">Auteur et créateur de BlogReact</p>
                    <div class="flex space-x-4 mt-2">
                        <a href="#" class="text-blue-600 hover:text-blue-800">
                            <i class="fab fa-twitter"></i>
                        </a>
                        <a href="#" class="text-blue-600 hover:text-blue-800">
                            <i class="fab fa-linkedin"></i>
                        </a>
                        <a href="#" class="text-blue-600 hover:text-blue-800">
                            <i class="fab fa-github"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Related Articles -->
        <section class="mb-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Articles Similaires</h2>
            <div id="related-articles" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Related articles will be loaded here -->
            </div>
        </section>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-4">
            <button onclick="window.location.href='index.html'" class="flex-1 x-gradient text-white py-3 px-6 rounded-lg font-semibold btn-hover transition-all duration-300 transform hover:scale-105">
                <i class="fas fa-arrow-left mr-2"></i>Retour à l'accueil
            </button>
            <button onclick="window.location.href='dashboard.html'" class="flex-1 bg-white border x-border text-gray-700 py-3 px-6 rounded-lg font-semibold hover:bg-gray-50 transition-all duration-300">
                <i class="fas fa-edit mr-2"></i>Gérer les articles
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-6 mt-12">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-gray-400">&copy; 2026 BlogReact. Tous droits réservés.</p>
        </div>
    </footer>

<script>

// ================= CONFIG =================
const API = "https://blogreact12-api.reatest.workers.dev";

// ================= MOBILE MENU =================
const mobileMenuBtn = document.getElementById('mobile-menu-btn');
const mobileMenu = document.getElementById('mobile-menu');

mobileMenuBtn.addEventListener('click', () => {
    mobileMenu.classList.toggle('hidden');
});

// ================= GET ID =================
const urlParams = new URLSearchParams(window.location.search);
const articleId = urlParams.get('id');

// ================= LOAD ARTICLE =================
async function loadArticle() {

    if (!articleId) {
        window.location.href = "index.html";
        return;
    }

    try {

        // 🔥 IMPORTANT: utiliser la liste puis filtrer (plus fiable)
        const res = await fetch(`${API}/api/articles`);
        const result = await res.json();

        if (!result.success || !result.data) {
            throw new Error("API error");
        }

        const article = result.data.find(a => a.id == articleId);

        if (!article) throw new Error("Article not found");

        console.log("ARTICLE:", article);

        displayArticle(article);

    } catch (error) {

        console.error(error);

        document.getElementById("article-content").innerHTML = `
        <div class="text-center py-12">
            <i class="fas fa-newspaper text-6xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 text-lg">Article non trouvé</p>
        </div>`;
    }
}

// ================= FORMAT CONTENT =================
function formatArticleContent(content) {

    if (!content) return "";

    return content
        .split(/\n\s*\n/)
        .filter(p => p.trim() !== "")
        .map(p => `<p>${p.replace(/\n/g,"<br>")}</p>`)
        .join("");
}

// ================= DISPLAY =================
function displayArticle(article) {

    // 🔥 FIX UNIVERSAL (IMPORTANT)
    const titre = article.titre || article.title;
    const contenu = article.contenu || article.content;
    const categorie = article.categorie || article.category;
    const auteur = article.auteur || article.author;

    // TITLE
    document.getElementById("article-title").textContent = titre;

    // CONTENT
    document.getElementById("article-content").innerHTML =
        formatArticleContent(contenu);

    // DATE
    document.getElementById("article-date").textContent =
        new Date(article.date).toLocaleDateString("fr-FR");

    // CATEGORY
    document.getElementById("article-category").textContent =
        categorie || "Général";

    // AUTHOR
    document.getElementById("article-author").textContent =
        auteur || "Admin";

    // VIEWS / LIKES
    document.getElementById("article-views").textContent =
        article.views || 0;

    document.getElementById("like-count").textContent =
        article.likes || 0;

    // ================= IMAGE FIX =================
    let image = article.image;

    if (!image) {
        image = `https://picsum.photos/seed/${article.id}/800/400`;
    } 
    else if (!image.startsWith("http")) {
        image = "https://blogreact12.pages.dev/" + image;
    }

    const img = document.getElementById("article-image");

    img.src = image;
    img.alt = titre;

    img.onerror = () => {
        img.src = `https://picsum.photos/seed/${article.id}/800/400`;
    };

    // ================= READ TIME =================
    const readTime = Math.ceil(contenu.split(" ").length / 200);

    document.getElementById("article-read-time").textContent =
        `${readTime} min de lecture`;

    // ================= RELATED =================
    loadRelatedArticles(categorie, article.id);
}

// ================= RELATED ARTICLES =================
async function loadRelatedArticles(category, currentId) {

    try {

        const res = await fetch(`${API}/api/articles`);
        const result = await res.json();

        const related = result.data
            .filter(a => (a.category || a.categorie) === category && a.id != currentId)
            .slice(0, 4);

        const container = document.getElementById("related-articles");

        if (!related.length) {
            container.innerHTML = `<p class="text-gray-500 col-span-2 text-center py-8">Aucun article similaire</p>`;
            return;
        }

        container.innerHTML = related.map(article => {

            const titre = article.titre || article.title;
            const contenu = article.contenu || article.content;

            let image = article.image || "https://picsum.photos/400/250";

            return `
            <article onclick="viewArticle(${article.id})"
                class="bg-gray-50 rounded-xl p-6 cursor-pointer hover:shadow-xl">

                <img src="${image}" class="w-full h-40 object-cover rounded mb-3">

                <h3 class="font-bold text-lg mb-2">${titre}</h3>

                <p class="text-gray-600 text-sm mb-3">
                    ${contenu.substring(0,120)}...
                </p>

                <div class="text-xs text-gray-400 flex justify-between">
                    <span>${article.auteur || "Admin"}</span>
                    <span>${new Date(article.date).toLocaleDateString()}</span>
                </div>

            </article>`;
        }).join("");

    } catch (e) {
        console.error(e);
    }
}

// ================= NAVIGATION =================
window.viewArticle = function(id) {
    window.location.href = `article.html?id=${id}`;
};

// ================= LIKE =================
const likeBtn = document.getElementById("like-btn");
const likeCount = document.getElementById("like-count");

likeBtn.addEventListener("click", () => {
    likeBtn.classList.toggle("liked");

    let count = parseInt(likeCount.textContent);

    likeCount.textContent = likeBtn.classList.contains("liked")
        ? count + 1
        : count - 1;
});

// ================= SHARE =================
document.getElementById("share-btn").addEventListener("click", () => {

    if (navigator.share) {
        navigator.share({
            title: document.getElementById("article-title").textContent,
            url: window.location.href
        });
    } else {
        navigator.clipboard.writeText(window.location.href);
        alert("Lien copié !");
    }
});

// ================= AUTH MENU =================
function updateNavigationMenu() {

    const token = localStorage.getItem("token");

    document.getElementById("menu-login").style.display =
        token ? "none" : "inline-block";

    document.getElementById("menu-admin").style.display =
        token ? "inline-block" : "none";
}

// ================= INIT =================
document.addEventListener("DOMContentLoaded", () => {
    updateNavigationMenu();
    loadArticle();
});

</script>
</body>
</html>
